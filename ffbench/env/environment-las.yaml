# LAS (learning_adaptive_safety) baseline env -- exact freeze of the working env (2026-09-07).
# The forks need an old gym; install order matters, see ffbench/env/setup.sh --las:
#   pip install 'pip<24.1' 'setuptools==65.7.0' 'wheel<0.41'
#   pip install --no-deps --no-build-isolation gym==0.19.0
#   pip install --no-deps git+https://github.com/luigiberducci/f1tenth_gym.git@asrl-submission-refactoring#egg=f110_gym
#   pip install git+https://github.com/luigiberducci/omnisafe.git@asrl-submission#egg=omnisafe
